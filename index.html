<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday, Mrs. Wayne ♡</title>

<style>

/* =========================
   GENERAL
========================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background:
    radial-gradient(
      circle at 50% 35%,
      #ffffff 0%,
      #fff5f6 45%,
      #f9e5e9 100%
    );

  color: #613d43;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;
}


/* =========================
   MAIN CONTAINER
========================= */

.container {
  width: 100%;
  max-width: 600px;

  padding: 30px 20px;

  text-align: center;
}


/* =========================
   TEXT
========================= */

.motto {
  font-size: 13px;
  letter-spacing: 5px;

  color: #a56d76;

  margin-bottom: 14px;
}

h1 {
  margin: 0;

  font-size: clamp(28px, 7vw, 40px);

  line-height: 1.25;

  font-weight: normal;

  color: #633b43;
}

.subtitle {
  margin-top: 10px;

  font-size: 15px;

  font-style: italic;

  color: #9a6870;
}


/* =========================
   CAKE AREA
========================= */

.cake-area {
  position: relative;

  width: 330px;
  height: 330px;

  margin: 45px auto 0;
}


/* =========================
   PLATE
========================= */

.plate {
  position: absolute;

  bottom: 18px;
  left: 15px;

  width: 300px;
  height: 32px;

  background: #ffffff;

  border-radius: 50%;

  box-shadow:
    0 8px 15px rgba(110, 55, 65, 0.12),
    inset 0 -4px 8px rgba(210, 170, 175, 0.3);
}


/* =========================
   CAKE
========================= */

.cake {
  position: absolute;

  bottom: 43px;
  left: 38px;

  width: 255px;
  height: 135px;

  border-radius:
    14px
    14px
    22px
    22px;

  background:
    linear-gradient(
      to bottom,
      #f7d0ca 0%,
      #f3c0bc 45%,
      #e9aaa9 46%,
      #e7a5a5 100%
    );

  box-shadow:
    0 7px 0 #d99094,
    0 13px 18px rgba(100, 45, 55, 0.14);

  overflow: visible;
}


/* subtle cake layer */

.cake::before {
  content: "";

  position: absolute;

  left: 0;
  top: 43px;

  width: 100%;
  height: 4px;

  background:
    rgba(180, 105, 110, 0.18);
}


/* bottom cake shadow */

.cake::after {
  content: "";

  position: absolute;

  left: 18px;
  right: 18px;

  bottom: 17px;

  height: 7px;

  border-radius: 50%;

  background:
    rgba(160, 82, 90, 0.12);
}


/* =========================
   CAKE TOP SHADOW
========================= */

.top-shadow {
  position: absolute;

  left: 30px;
  top: -5px;

  width: 195px;
  height: 18px;

  border-radius: 50%;

  background:
    rgba(220, 180, 183, 0.22);
}


/* =========================
   WHITE FROSTING
========================= */

.frosting {
  position: absolute;

  left: -7px;
  top: -25px;

  width: 269px;
  height: 62px;

  background: #fffdfd;

  border-radius: 50%;

  box-shadow:
    0 5px 8px rgba(140, 85, 90, 0.12),
    inset 0 -5px 7px rgba(230, 215, 217, 0.55);

  z-index: 3;
}


/* =========================
   FROSTING DRIPS
========================= */

.drip {
  position: absolute;

  top: 25px;

  width: 27px;
  height: 38px;

  background: #fffdfd;

  border-radius:
    0
    0
    18px
    18px;
}

.drip1 {
  left: 28px;
}

.drip2 {
  left: 82px;
  height: 48px;
}

.drip3 {
  left: 143px;
  height: 33px;
}

.drip4 {
  left: 201px;
  height: 43px;
}


/* =========================
   CREAM LAYER
========================= */

.cream-layer {
  position: absolute;

  left: 5px;
  top: 34px;

  width: 245px;
  height: 27px;

  background: #fffafa;

  border-radius: 50%;

  box-shadow:
    0 3px 5px rgba(130, 75, 80, 0.12);

  z-index: 2;
}


/* =========================
   LITTLE CREAM DOTS
========================= */

.cream-dot {
  position: absolute;

  z-index: 6;

  width: 10px;
  height: 10px;

  background: #ffffff;

  border-radius: 50%;

  box-shadow:
    0 2px 3px rgba(120, 70, 75, 0.12);
}

.dot1 {
  left: 67px;
  top: 7px;
}

.dot2 {
  left: 136px;
  top: 4px;
}

.dot3 {
  right: 68px;
  top: 8px;
}


/* =========================
   STRAWBERRIES
========================= */

.strawberry {
  position: absolute;

  z-index: 7;

  width: 27px;
  height: 34px;

  background:
    radial-gradient(
      circle at 35% 25%,
      #ff9da0 0 4%,
      transparent 5%
    ),
    linear-gradient(
      145deg,
      #f06a70,
      #d93647
    );

  border-radius:
    52%
    52%
    48%
    48%;

  box-shadow:
    0 3px 4px rgba(130, 40, 50, 0.18);
}


/* strawberry leaves */

.strawberry::before {
  content: "✦";

  position: absolute;

  top: -14px;
  left: 5px;

  color: #628e58;

  font-size: 18px;
}


/* strawberry seeds */

.strawberry::after {
  content: "•  •  •";

  position: absolute;

  top: 12px;
  left: 3px;

  width: 25px;

  color: #ffe0a8;

  font-size: 9px;

  letter-spacing: 3px;
}


/* strawberry positions */

.berry1 {
  left: 40px;
  top: -27px;

  transform: rotate(-14deg);
}

.berry2 {
  left: 112px;
  top: -31px;

  transform: rotate(4deg);
}

.berry3 {
  right: 40px;
  top: -26px;

  transform: rotate(13deg);
}

.berry4 {
  left: 72px;
  top: 9px;

  width: 22px;
  height: 28px;

  transform: rotate(17deg);
}

.berry5 {
  right: 70px;
  top: 8px;

  width: 22px;
  height: 28px;

  transform: rotate(-16deg);
}


/* =========================
   CANDLE
========================= */

.candle {
  position: absolute;

  z-index: 20;

  /*
     IMPORTANT:
     The candle is positioned
     INSIDE the cake area.
  */

  left: 156px;
  top: 88px;

  width: 18px;
  height: 72px;

  border-radius: 5px;

  background:
    repeating-linear-gradient(
      -45deg,
      #ef9da9 0px,
      #ef9da9 7px,
      #ffffff 7px,
      #ffffff 14px
    );

  box-shadow:
    inset 2px 0 3px rgba(255,255,255,0.8),
    2px 4px 6px rgba(100,50,60,0.15);

  cursor: pointer;
}


/* =========================
   WICK
========================= */

.wick {
  position: absolute;

  top: -7px;
  left: 7px;

  width: 3px;
  height: 9px;

  background: #493537;

  border-radius: 3px;
}


/* =========================
   FLAME
========================= */

.flame {
  position: absolute;

  left: -5px;
  top: -34px;

  width: 28px;
  height: 36px;

  background:
    radial-gradient(
      ellipse at 50% 65%,
      #fff5c4 0 22%,
      #ffc44d 23% 58%,
      #f28b35 59% 100%
    );

  border-radius:
    55%
    45%
    55%
    45%;

  transform: rotate(45deg);

  box-shadow:
    0 0 12px #ffc766,
    0 0 25px rgba(255,184,70,0.6);

  transition:
    all 0.35s ease;
}


/* flame after clicking */

.flame.off {
  opacity: 0;

  transform:
    translateY(-15px)
    scale(0.15)
    rotate(45deg);
}


/* =========================
   SMOKE
========================= */

.smoke {
  position: absolute;

  top: -45px;
  left: 2px;

  font-size: 26px;

  color: #9c9697;

  opacity: 0;

  transform: translateY(5px);

  transition:
    0.8s ease;
}

.smoke.show {
  opacity: 0.35;

  transform:
    translateY(-18px);
}


/* =========================
   INSTRUCTION
========================= */

.instruction {
  margin-top: -5px;

  font-size: 14px;

  color: #a16b73;

  letter-spacing: 0.4px;
}


/* =========================
   MESSAGE AFTER CANDLE
========================= */

.message {
  margin:
    22px auto
    0;

  max-width: 430px;

  font-size: 15px;

  line-height: 1.7;

  color: #80545c;

  opacity: 0;

  transform:
    translateY(8px);

  transition:
    0.8s ease;
}

.message.show {
  opacity: 1;

  transform:
    translateY(0);
}


/* =========================
   HEART
========================= */

.heart {
  margin-top: 14px;

  color: #c77b85;

  font-size: 20px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

  .container {
    padding:
      25px 15px;
  }

  .motto {
    font-size: 11px;
    letter-spacing: 4px;
  }

  h1 {
    font-size: 29px;
  }

  .subtitle {
    font-size: 14px;
  }

  .cake-area {
    transform:
      scale(0.88);

    margin-top: 35px;

    margin-bottom:
      -25px;
  }

}

</style>
</head>


<body>


<div class="container">


  <!-- TOP TEXT -->

  <div class="motto">
    LIVE • LOVE • LAUGH
  </div>


  <h1>
    Happy Birthday, Mrs. Wayne ♡
  </h1>


  <div class="subtitle">
    A little cake for a beautiful day.
  </div>



  <!-- CAKE -->

  <div class="cake-area">


    <!-- PLATE -->

    <div class="plate"></div>


    <!-- CAKE BODY -->

    <div class="cake">


      <div class="top-shadow"></div>


      <!-- WHITE FROSTING -->

      <div class="frosting">

        <div class="drip drip1"></div>

        <div class="drip drip2"></div>

        <div class="drip drip3"></div>

        <div class="drip drip4"></div>


        <div class="cream-dot dot1"></div>

        <div class="cream-dot dot2"></div>

        <div class="cream-dot dot3"></div>

      </div>


      <!-- CREAM LAYER -->

      <div class="cream-layer"></div>


      <!-- STRAWBERRIES -->

      <div class="strawberry berry1"></div>

      <div class="strawberry berry2"></div>

      <div class="strawberry berry3"></div>

      <div class="strawberry berry4"></div>

      <div class="strawberry berry5"></div>


    </div>


    <!-- CANDLE -->

    <div
      class="candle"
      onclick="blowCandle()"
    >

      <div class="wick"></div>

      <div
        class="flame"
        id="flame"
      ></div>

      <div
        class="smoke"
        id="smoke"
      >
        〰
      </div>

    </div>


  </div>



  <!-- INSTRUCTION -->

  <div class="instruction">
    Make a wish and click the flame ♡
  </div>



  <!-- MESSAGE -->

  <div
    class="message"
    id="message"
  >
    May your life be filled with love,
    laughter, beautiful moments,
    and little reasons to smile.
  </div>



  <div class="heart">
    ♡
  </div>


</div>



<script>

function blowCandle() {

  const flame =
    document.getElementById("flame");

  const smoke =
    document.getElementById("smoke");

  const message =
    document.getElementById("message");


  flame.classList.add("off");

  smoke.classList.add("show");

  message.classList.add("show");

}

</script>


</body>
</html>
